{{- if .Values.serviceMonitor.enabled -}}
# ServiceMonitor lets Prometheus auto-discover this service.
# kube-prometheus-stack (Phase 8) is configured with
# `serviceMonitorSelectorNilUsesHelmValues: false`, so it picks up
# any ServiceMonitor in any namespace.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "bookstore.fullname" . }}
  labels:
    {{- include "bookstore.labels" . | nindent 4 }}
    release: prometheus     # required by kube-prometheus-stack default selector
spec:
  selector:
    matchLabels:
      {{- include "bookstore.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}