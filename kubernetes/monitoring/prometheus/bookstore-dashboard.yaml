# Grafana auto-discovers ConfigMaps with label `grafana_dashboard: "1"`
# (we configured this in values.yaml under grafana.sidecar.dashboards).
#
# Apply with: kubectl apply -f bookstore-dashboard.yaml -n monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: bookstore-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  bookstore.json: |
    {
      "title": "Bookstore API",
      "uid": "bookstore-api",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Request rate (req/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"bookstore-bookstore\"}[1m])) by (handler, method)",
              "legendFormat": "{{ '{{' }}method{{ '}}' }} {{ '{{' }}handler{{ '}}' }}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Error rate (5xx)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"bookstore-bookstore\",status=~\"5..\"}[1m]))",
              "legendFormat": "5xx"
            }
          ]
        },
        {
          "id": 3,
          "title": "p95 latency (seconds)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, handler) (rate(http_request_duration_seconds_bucket{job=\"bookstore-bookstore\"}[5m])))",
              "legendFormat": "p95 {{ '{{' }}handler{{ '}}' }}"
            }
          ]
        }
      ]
    }
