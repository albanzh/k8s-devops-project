# Jenkins Helm chart values — full JCasC + ephemeral agents
# Chart: jenkins/jenkins (https://charts.jenkins.io)
#
# Highlights:
#   - Plugins resolved automatically (no version pinning to fight)
#   - JCasC defines a Kubernetes cloud + 2 pod templates (jenkins-agent + build)
#   - 'build' agent has containers for kaniko, trivy, helm, kubectl, python
#   - Agents are ephemeral: spawn on demand, deleted after job (podRetention=Never)
#   - TLS via cert-manager (default: letsencrypt-staging — flip to prod when ready)

controller:
  image:
    registry: docker.io
    repository: jenkins/jenkins
    tag: "lts-jdk17"   # rolling LTS — always compatible with latest plugins

  # Auto-resolve plugin dependencies (avoids manual version-pinning hell).
  installLatestPlugins: true
  installPlugins:
    - kubernetes
    - kubernetes-credentials-provider
    - workflow-aggregator
    - git
    - configuration-as-code
    - credentials-binding
    - blueocean
    - prometheus
    - job-dsl
    - pipeline-stage-view

  # Admin password from a pre-existing K8s secret (we create it before helm install)
  admin:
    existingSecret: jenkins-admin-credentials

  # Ingress — host gets templated by the install README based on your DOMAIN
  ingress:
    enabled: true
    ingressClassName: nginx
    hostName: "jenkins.asterzheku.duckdns.org"   # ← edit before install
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      - secretName: jenkins-tls
        hosts: ["jenkins.asterzheku.duckdns.org"]   # ← match hostName above

  # Resource ask — controller is heavy with plugins
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

  # Schedule controller on workers (not master) so pipelines don't compete
  # with the control plane for CPU/memory.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

  # ─── JCasC: declarative Jenkins config ───────────────────────────
  JCasC:
    defaultConfig: true
    configScripts:
      kubernetes-cloud: |
        jenkins:
          clouds:
            - kubernetes:
                name: "kubernetes"
                serverUrl: "https://kubernetes.default.svc.cluster.local"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
                jenkinsTunnel: "jenkins-agent.jenkins.svc.cluster.local:50000"
                connectTimeout: 5
                readTimeout: 15
                containerCapStr: "10"
                maxRequestsPerHostStr: "32"
                retentionTimeout: 5
                waitForPodSec: 600
                templates:
                  # ── Default lightweight agent ──────────────────
                  - name: "jenkins-agent"
                    label: "jenkins-agent"
                    nodeUsageMode: "NORMAL"
                    serviceAccount: "jenkins"
                    containers:
                      - name: "jnlp"
                        image: "jenkins/inbound-agent:3309.v27b_9314fd1a_4-2-jdk17"
                        workingDir: "/home/jenkins/agent"
                        resourceRequestCpu: "200m"
                        resourceRequestMemory: "256Mi"
                        resourceLimitCpu: "500m"
                        resourceLimitMemory: "512Mi"
                    idleMinutes: 0
                    activeDeadlineSeconds: 1200

                  # ── Build agent: full CI toolchain in one pod ──
                  - name: "build-agent"
                    label: "build"
                    nodeUsageMode: "EXCLUSIVE"
                    serviceAccount: "jenkins"
                    containers:
                      - name: "jnlp"
                        image: "jenkins/inbound-agent:3309.v27b_9314fd1a_4-2-jdk17"
                        workingDir: "/home/jenkins/agent"
                        resourceRequestCpu: "200m"
                        resourceRequestMemory: "256Mi"
                        resourceLimitCpu: "500m"
                        resourceLimitMemory: "512Mi"

                      # Kaniko: builds OCI images without Docker daemon (no privileged mode!)
                      - name: "kaniko"
                        image: "gcr.io/kaniko-project/executor:v1.23.2-debug"
                        command: "/busybox/cat"
                        ttyEnabled: true
                        resourceRequestCpu: "500m"
                        resourceRequestMemory: "512Mi"
                        resourceLimitCpu: "1"
                        resourceLimitMemory: "1Gi"

                      # Trivy: scan images for CVEs (pinned to a known-published tag)
                      - name: "trivy"
                        image: "aquasec/trivy:0.59.1"
                        command: "cat"
                        ttyEnabled: true
                        resourceRequestCpu: "200m"
                        resourceRequestMemory: "256Mi"

                      # Helm: deploy charts to K8s
                      - name: "helm"
                        image: "alpine/helm:3.16.3"
                        command: "cat"
                        ttyEnabled: true
                        resourceRequestCpu: "100m"
                        resourceRequestMemory: "128Mi"

                      # kubectl: rollout status, get pods, etc.
                      # alpine/k8s is a multi-tool image (kubectl+helm+kustomize)
                      # with a sane entrypoint that respects command: "cat".
                      - name: "kubectl"
                        image: "alpine/k8s:1.28.15"
                        command: "cat"
                        ttyEnabled: true
                        resourceRequestCpu: "100m"
                        resourceRequestMemory: "128Mi"

                      # Python: pytest + dependencies
                      - name: "python"
                        image: "python:3.12-slim"
                        command: "cat"
                        ttyEnabled: true
                        resourceRequestCpu: "200m"
                        resourceRequestMemory: "256Mi"
                    idleMinutes: 0
                    activeDeadlineSeconds: 1800

# ─── Ephemeral agent settings ──────────────────────────────────────
agent:
  enabled: true
  podRetention: "Never"   # delete agent pod after job completes (truly ephemeral)

# ─── Persistence ───────────────────────────────────────────────────
persistence:
  enabled: true
  size: 10Gi
  storageClass: local-path   # set after Phase 3.1 installs the StorageClass

# ─── RBAC ──────────────────────────────────────────────────────────
# Scoped to jenkins + bookstore namespaces (NOT cluster-admin).
# This is more secure than the chart's default of `clusterAdminRole: true`.
rbac:
  create: true
  readSecrets: true   # so the K8s creds plugin can read Secrets

serviceAccount:
  create: true
  name: jenkins